{{- define "main" }}

<article class="post-single">
  <header class="post-header">
    <h1 class="post-title" id="secret-title">🔒 隐藏内容</h1>
    <div class="post-meta"><span id="secret-meta">该内容已加密，验证口令后查看</span></div>
  </header>

  <div id="secret-locked" class="secret-locked">
    <p class="secret-hint">本页内容已加密。请输入口令解锁（与首页、搜索页相同）：</p>
    <div class="widget-lock-form">
      <input type="text" id="login-user" class="login-input" placeholder="用户 (User)">
      <input type="text" id="login-pos" class="login-input" placeholder="坐标 (Location)">
      <input type="text" id="login-time" class="login-input" placeholder="时间 (Time)">
      <button id="login-btn" class="login-btn" type="button">解锁</button>
      <div id="login-msg" class="login-msg" style="display:none;"></div>
    </div>
  </div>

  <div id="secret-content" class="post-content md-content" hidden></div>

  {{- /* 评论区（浏览完文章后的最下面） */}}
  {{- if ne (.Param "comments") false }}
  {{- partial "comments.html" . }}
  {{- end }}

  <script>
  document.addEventListener("DOMContentLoaded", function() {
      var pagePath = window.location.pathname;
      var locked = document.getElementById("secret-locked");
      var content = document.getElementById("secret-content");
      var titleEl = document.getElementById("secret-title");
      var msg = document.getElementById("login-msg");

      function render(key) {
          return SecretVault.items(key).then(function(items) {
              var current = null;
              items.forEach(function(it) {
                  var p = it.permalink;
                  try { p = new URL(p).pathname; } catch (e) {}
                  if (p === pagePath) current = it;
              });
              if (!current) {
                  if (msg) { msg.style.color = "#ff4757"; msg.innerText = "内容加载失败，请刷新重试"; msg.style.display = "block"; }
                  return;
              }
              locked.hidden = true;
              content.innerHTML = current.html || "";
              content.hidden = false;
              var title = current.title || "隐藏内容";
              titleEl.textContent = title;
              var parts = document.title.split(" | ");
              document.title = title + (parts.length > 1 ? " | " + parts.slice(1).join(" | ") : "");
              var metaEl = document.getElementById("secret-meta");
              if (metaEl) {
                  if (current.date) { metaEl.textContent = current.date; }
                  else { metaEl.hidden = true; }
              }
          });
      }

      SecretVault.sessionKey().then(function(key) {
          if (key) render(key);
      });

      document.getElementById("login-btn").addEventListener("click", function() {
          var userVal = document.getElementById("login-user").value;
          var posVal = document.getElementById("login-pos").value;
          var timeVal = document.getElementById("login-time").value;
          var password = [userVal, posVal, timeVal].join(":");
          SecretVault.unlock(password).then(function(key) {
              if (key) {
                  if (msg) { msg.style.color = "#2ed573"; msg.innerText = "验证成功！"; msg.style.display = "block"; }
                  render(key);
              } else {
                  if (msg) { msg.style.color = "#ff4757"; msg.innerText = "密码或口令错误"; msg.style.display = "block"; }
              }
          }).catch(function(err) {
              var reason = (err && err.message) ? err.message : "未知原因";
              if (!window.crypto || !window.crypto.subtle) reason = "当前浏览器不支持网页加密，请换最新版 Chrome / Edge 访问";
              if (msg) { msg.style.color = "#ff4757"; msg.innerText = "验证失败：" + reason; msg.style.display = "block"; }
          });
      });
  });
  </script>
</article>

{{- end }}{{/* end main */}}
