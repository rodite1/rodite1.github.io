{{- $page := .Page }}
{{- $isSecret := eq $page.Section "secret" }}
<article class="home-card{{ if $isSecret }} secret-card{{ end }}"{{ if $isSecret }} data-secret hidden{{ end }}>
    {{- if $isSecret }}
    {{- /* 隐藏文章：不输出标题明文，解锁后由前端解密填入 */}}
    <h2 class="home-card-title" data-secret-title="{{ $page.Permalink }}">🔒 隐藏文章</h2>
    {{- else }}
    <h2 class="home-card-title">
        <a href="{{ $page.Permalink }}">{{ $page.Title }}</a>
    </h2>
    {{- end }}
</article>
