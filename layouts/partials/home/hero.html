{{- $covers := site.Params.defaultCovers | default (slice "/bg1.jpg") }}

<section class="hero">
    {{- /* 轮播背景（固定定位，铺满整个视口） */}}
    <div id="home-slider" aria-hidden="true">
        {{- range $covers }}
        <div class="slide" style="background-image: url('{{ . | absURL }}')"></div>
        {{- end }}
    </div>

    <div class="hero-inner">
        <h1 class="hero-title">{{ site.Title }}</h1>

        {{- with site.Params.heroSubtitle }}
        <p class="hero-subtitle" id="typing-text" data-text="{{ . }}"></p>
        {{- end }}
    </div>
</section>
