{{- $covers := site.Params.defaultCovers | default (slice "/bg1.jpg") }}

<section class="hero">
    {{- /* 轮播背景（固定定位，铺满整个视口） */}}
    <div id="home-slider" aria-hidden="true">
        {{- range $covers }}
        <div class="slide" style="background-image: url('{{ . | absURL }}')"></div>
        {{- end }}
    </div>

    <div class="hero-inner">
        <h1 class="hero-title">{{ site.Title }}</h1>

        {{- with site.Params.heroSubtitle }}
        <p class="hero-subtitle" id="typing-text" data-text="{{ . }}"></p>
        {{- end }}
    </div>

    <div class="scroll-down" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="rgba(255,255,255,0.7)" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1-.708z"/></svg>
    </div>
</section>
