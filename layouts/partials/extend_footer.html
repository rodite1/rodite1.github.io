<!-- ==================== 雪花特效 ==================== -->
<canvas id="snow-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;"></canvas>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var canvas = document.getElementById("snow-canvas"); var ctx = canvas.getContext("2d");
    var width = canvas.width = window.innerWidth; var height = canvas.height = window.innerHeight; var flakes = [];
    window.addEventListener("resize", function() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });
    for (var i = 0; i < 150; i++) { flakes.push({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 3 + 1, d: Math.random() + 1, color: "rgba(255, 255, 255, " + (Math.random() * 0.5 + 0.3) + ")" }); }
    function drawFlakes() {
        ctx.clearRect(0, 0, width, height); ctx.fillStyle = "white"; ctx.beginPath();
        for (var i = 0; i < flakes.length; i++) { var f = flakes[i]; ctx.fillStyle = f.color; ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true); }
        ctx.fill(); moveFlakes();
    }
    var angle = 0;
    function moveFlakes() {
        angle += 0.01;
        for (var i = 0; i < flakes.length; i++) { var f = flakes[i]; f.y += Math.pow(f.d, 2) + 0.5; f.x += Math.sin(angle) * 1; if (f.y > height) { flakes[i] = { x: Math.random() * width, y: 0, r: f.r, d: f.d, color: f.color }; } }
    }
    setInterval(drawFlakes, 30);
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. 轮播图
    var slides = document.querySelectorAll(".slide"); var currentSlide = 0;
    if (slides.length > 0) {
        slides[0].classList.add("active");
        setInterval(function() { slides[currentSlide].classList.remove("active"); currentSlide = (currentSlide + 1) % slides.length; slides[currentSlide].classList.add("active"); }, 6000);
    }

    // 2. 彻底重写首页布局 (不再依赖原生的 .home-info)
    var mainContainer = document.querySelector('.main');
    if (mainContainer) {
        // 抓取所有文章
        var posts = Array.from(document.querySelectorAll('.main .post-entry'));
        
        // 构建全新的 HTML 结构：大屏幕 + 左右双栏
        var heroHTML = `
            <div id="custom-hero" style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative; width:100%;">
                <h1 style="font-size:4rem; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); margin-bottom:10px; font-weight:700; color:#fff;">Rodite</h1>
                <p id="typing-text" style="font-size:1.5rem; text-shadow: 1px 1px 5px rgba(0,0,0,0.8); color:#ccc;"></p>
                <div class="scroll-down">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="rgba(255,255,255,0.7)" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1-.708z"/></svg>
                </div>
            </div>
        `;
        var wrapperHTML = `
            <div class="home-content-wrapper">
                <div class="main-list-col" id="post-container"></div>
                <div class="sidebar-col" id="sidebar-container"></div>
            </div>
        `;
        
        // 清空原有的全部乱局，注入新结构
        mainContainer.innerHTML = heroHTML + wrapperHTML;
        
        // 把之前抓到的文章塞进左边
        var postContainer = document.getElementById('post-container');
        posts.forEach(function(post) {
            postContainer.appendChild(post);
        });
        
        // 把侧边栏塞进右边
        var sidebar = document.getElementById('global-sidebar');
        if (sidebar) {
            sidebar.style.display = 'flex';
            sidebar.style.flexDirection = 'column';
            document.getElementById('sidebar-container').appendChild(sidebar);
        }

        // 3. 启动打字机
        setTimeout(function() {
            var el = document.getElementById('typing-text');
            if (el) {
                var text = "What if God were a girl？";
                var i = 0;
                function type() {
                    if (i < text.length) {
                        el.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, 150);
                    }
                }
                type();
            }
        }, 500);
    }

    // 4. 音乐播放
    var music = document.getElementById("bg-music"); var btn = document.getElementById("music-btn");
    if (music && btn) {
        music.volume = 0.4;
        var wasPlaying = sessionStorage.getItem("musicPlaying") === "true";
        var savedTime = sessionStorage.getItem("musicTime");
        if (wasPlaying) {
            if (savedTime) music.currentTime = parseFloat(savedTime);
            music.play().then(() => { btn.innerHTML = "And so, we met."; }).catch(e => {});
        }
        music.addEventListener("play", function() { sessionStorage.setItem("musicPlaying", "true"); btn.innerHTML = "And so, we met."; });
        music.addEventListener("pause", function() { sessionStorage.setItem("musicPlaying", "false"); btn.innerHTML = "What if God were a girl？"; });
        setInterval(function() { if (!music.paused) sessionStorage.setItem("musicTime", music.currentTime); }, 1000);
        btn.addEventListener("click", function() { if (music.paused) music.play(); else music.pause(); });
    }
});
</script>

<!-- ==================== 底部访客统计与文章点赞 ==================== -->
<style>
    .custom-stats { text-align: center; font-size: 14px; margin-top: 20px; color: #888; padding-bottom: 20px; }
    .custom-stats span { margin: 0 10px; display: inline-flex; align-items: center; }
    .post-meta-stats { display: flex; gap: 15px; align-items: center; margin: 15px 0; font-size: 14px; color: #a3a3a3; }
    .like-btn { cursor: pointer; display: flex; align-items: center; gap: 5px; transition: transform 0.2s; }
    .like-btn:hover { color: #ff4757; transform: scale(1.1); }
    .like-btn.liked { color: #ff4757; }
</style>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var footer = document.querySelector('.footer');
    if (footer) {
        var statsDiv = document.createElement('div'); statsDiv.className = 'custom-stats';
        statsDiv.innerHTML = `<span>挥一挥衣袖：<span id="busuanzi_value_site_uv"></span> 人</span><span>不带走一片云彩：<span id="busuanzi_value_site_pv"></span> 次</span>`;
        footer.parentNode.insertBefore(statsDiv, footer.nextSibling);
    }
    var isPost = document.querySelector('.post-single');
    if (isPost) {
        var postHeader = document.querySelector('.post-header');
        var postContent = document.querySelector('.post-content');
        var pageKey = 'like_' + window.location.pathname;
        var likeCount = localStorage.getItem(pageKey) || 0;
        var statsHTML = `<div class="post-meta-stats"><div class="busuanzi-page-pv">👁️ 浏览：<span id="busuanzi_value_page_pv">0</span> 次</div><div class="like-btn"><span>❤️</span> 点赞：<span class="like-count">${likeCount}</span></div></div>`;
        if(postHeader) postHeader.insertAdjacentHTML('afterend', statsHTML);
        if(postContent) postContent.insertAdjacentHTML('beforeend', statsHTML);
        var btns = document.querySelectorAll('.like-btn');
        btns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                var currentCount = parseInt(localStorage.getItem(pageKey) || 0) + 1;
                localStorage.setItem(pageKey, currentCount);
                document.querySelectorAll('.like-count').forEach(el => { el.innerText = currentCount; });
                btns.forEach(b => b.classList.add('liked'));
            });
            if (parseInt(localStorage.getItem(pageKey) || 0) > 0) { btn.classList.add('liked'); }
        });
    }
});
</script>
