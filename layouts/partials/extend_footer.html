<!-- ==================== 雪花特效 ==================== -->
<canvas id="snow-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;"></canvas>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var canvas = document.getElementById("snow-canvas");
    var ctx = canvas.getContext("2d");
    var width = canvas.width = window.innerWidth;
    var height = canvas.height = window.innerHeight;
    var flakes = [];

    window.addEventListener("resize", function() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    for (var i = 0; i < 150; i++) {
        flakes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 3 + 1,
            d: Math.random() + 1,
            color: "rgba(255, 255, 255, " + (Math.random() * 0.5 + 0.3) + ")"
        });
    }

    function drawFlakes() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "white";
        ctx.beginPath();
        for (var i = 0; i < flakes.length; i++) {
            var f = flakes[i];
            ctx.fillStyle = f.color;
            ctx.moveTo(f.x, f.y);
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
        }
        ctx.fill();
        moveFlakes();
    }

    var angle = 0;
    function moveFlakes() {
        angle += 0.01;
        for (var i = 0; i < flakes.length; i++) {
            var f = flakes[i];
            f.y += Math.pow(f.d, 2) + 0.5;
            f.x += Math.sin(angle) * 1;
            if (f.y > height) {
                flakes[i] = { x: Math.random() * width, y: 0, r: f.r, d: f.d, color: f.color };
            }
        }
    }
    setInterval(drawFlakes, 30);
});
</script>

<style>
    /* 1. 清理网页底色 */
    html, body, .main, .list, #content, #wrapper, main, .home-info {
        background-color: transparent !important;
        background-image: none !important;
        box-shadow: none !important;
    }

    /* 2. 轮播图与遮罩 */
    #home-slider {
        position: fixed !important;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: -999 !important;
        pointer-events: none;
    }
    .slide {
        position: absolute;
        width: 100%; height: 100%;
        background-size: cover !important;
        background-position: center !important;
        opacity: 0;
        transition: opacity 2s ease-in-out;
    }
    .slide.active { opacity: 1 !important; }
    body::before {
        content: "" !important;
        position: fixed !important;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background-color: rgba(0, 0, 0, 0.5) !important;
        z-index: -998 !important;
        pointer-events: none;
    }

    /* 3. 强制首屏占满全屏并居中 */
    .home-info {
        height: 100vh !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        margin-top: -60px !important; /* 向上微调避开导航栏 */
    }
    .home-info .entry-header h1 {
        font-size: 4rem !important;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.8) !important;
        margin-bottom: 10px !important;
    }
    .home-info .entry-content {

    }

    /* 5. 底部向下箭头 */

<!-- 音乐部分 -->
<audio id="bg-music" src="/music.mp3" loop></audio>
<button id="music-btn" style="position: fixed; top: 80px; left: 20px; z-index: 10000; padding: 10px 15px; border-radius: 20px; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5); cursor: pointer; backdrop-filter: blur(5px); font-size: 14px;">
    What if God were a girl？
</button>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 轮播图
    var slides = document.querySelectorAll(".slide");
    var currentSlide = 0;
    if (slides.length > 0) {
        slides[0].classList.add("active");
        setInterval(function() {
            slides[currentSlide].classList.remove("active");
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add("active");
        }, 6000);
    }

    // 打字机特效
    setTimeout(function() {
        var el = document.querySelector('.home-info .entry-content');
        if (el) {
            var text = el.innerText;
            el.innerText = "";
            var i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 150); // 150毫秒一个字
                }
            }
            type();
        }
    }, 500);

    // 音乐
    var music = document.getElementById("bg-music");
    var btn = document.getElementById("music-btn");
    if (music && btn) {
        music.volume = 0.4;
        var wasPlaying = sessionStorage.getItem("musicPlaying") === "true";
        var savedTime = sessionStorage.getItem("musicTime");
        if (wasPlaying) {
            if (savedTime) music.currentTime = parseFloat(savedTime);
            music.play().then(() => { btn.innerHTML = "And so, we met."; }).catch(e => {});
        }
        music.addEventListener("play", function() {
            sessionStorage.setItem("musicPlaying", "true");
            btn.innerHTML = "And so, we met.";
        });
        music.addEventListener("pause", function() {
            sessionStorage.setItem("musicPlaying", "false");
            btn.innerHTML = "What if God were a girl？";
        });
        setInterval(function() {
            if (!music.paused) sessionStorage.setItem("musicTime", music.currentTime);
        }, 1000);
        btn.addEventListener("click", function() {
            if (music.paused) music.play(); else music.pause();
        });
    }
});
</script>
