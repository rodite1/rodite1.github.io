<!-- ==================== 雪花特效（仅首页） ==================== -->
<canvas id="snow-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;"></canvas>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var canvas = document.getElementById("snow-canvas"); var ctx = canvas.getContext("2d");
    var width = canvas.width = window.innerWidth; var height = canvas.height = window.innerHeight; var flakes = [];
    window.addEventListener("resize", function() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });
    for (var i = 0; i < 150; i++) { flakes.push({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 3 + 1, d: Math.random() + 1, color: "rgba(255, 255, 255, " + (Math.random() * 0.5 + 0.3) + ")" }); }
    function drawFlakes() {
        ctx.clearRect(0, 0, width, height); ctx.fillStyle = "white"; ctx.beginPath();
        for (var i = 0; i < flakes.length; i++) { var f = flakes[i]; ctx.fillStyle = f.color; ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true); }
        ctx.fill(); moveFlakes();
    }
    var angle = 0;
    function moveFlakes() {
        angle += 0.01;
        for (var i = 0; i < flakes.length; i++) { var f = flakes[i]; f.y += Math.pow(f.d, 2) + 0.5; f.x += Math.sin(angle) * 1; if (f.y > height) { flakes[i] = { x: Math.random() * width, y: 0, r: f.r, d: f.d, color: f.color }; } }
    }
    setInterval(drawFlakes, 30);
});
</script>
{{ end }}

<!-- ==================== 银白色鼠标拖尾（全站） ==================== -->
<canvas id="cursor-trail" style="position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9998;"></canvas>
<script>
(function() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var canvas = document.getElementById("cursor-trail");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0;
    function resize() {
        W = canvas.width = window.innerWidth * dpr;
        H = canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
    }
    resize();
    window.addEventListener("resize", resize);

    var pts = [];
    var running = false;
    function addPoint(x, y) {
        pts.push({ x: x, y: y, r: 1 + Math.random() * 1.8, life: 1, vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6 + 0.3 });
        if (pts.length > 260) pts.shift();
        if (!running) { running = true; requestAnimationFrame(loop); }
    }
    window.addEventListener("mousemove", function(e) {
        addPoint(e.clientX, e.clientY);
        if (Math.random() < 0.35) addPoint(e.clientX + (Math.random() - 0.5) * 8, e.clientY + (Math.random() - 0.5) * 8);
    }, { passive: true });
    window.addEventListener("touchmove", function(e) {
        var t = e.touches[0];
        if (t) addPoint(t.clientX, t.clientY);
    }, { passive: true });

    function loop() {
        ctx.clearRect(0, 0, W, H);
        for (var i = pts.length - 1; i >= 0; i--) {
            var p = pts[i];
            p.life -= 0.03;
            if (p.life <= 0) { pts.splice(i, 1); continue; }
            p.x += p.vx;
            p.y += p.vy;
            p.r *= 0.985;
            ctx.beginPath();
            ctx.fillStyle = "rgba(228, 232, 245, " + (p.life * 0.75).toFixed(3) + ")";
            ctx.arc(p.x * dpr, p.y * dpr, p.r * dpr, 0, Math.PI * 2);
            ctx.fill();
        }
        if (pts.length > 0) {
            requestAnimationFrame(loop);
        } else {
            running = false;  // 粒子全部消失后停止循环，不再空转
        }
    }
})();
</script>

<!-- ==================== 隐藏内容解密模块（全站，Web Crypto） ==================== -->
<script>
var SecretVault = (function() {
    var SECRET_URL = "/secret.json";
    var metaPromise = null;

    function b64ToBuf(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
    }
    function bufToB64(buf) {
        var bytes = new Uint8Array(buf);
        var bin = "";
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
    }

    function loadMeta() {
        if (!metaPromise) {
            metaPromise = fetch(SECRET_URL, { cache: "no-store" })
                .then(function(r) { if (!r.ok) throw new Error("secret meta " + r.status); return r.json(); })
                .catch(function() { return null; });
        }
        return metaPromise;
    }

    function deriveKey(password, meta) {
        var enc = new TextEncoder();
        return crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"])
            .then(function(km) {
                return crypto.subtle.deriveKey(
                    { name: "PBKDF2", salt: b64ToBuf(meta.kdf.salt), iterations: meta.kdf.iterations, hash: "SHA-256" },
                    km,
                    { name: "AES-GCM", length: 256 },
                    false,
                    ["decrypt"]
                );
            });
    }

    function decryptItem(key, item) {
        var raw = new Uint8Array(b64ToBuf(item.c));
        var iv = raw.slice(0, 12);
        var ct = raw.slice(12);
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct)
            .then(function(pt) { return JSON.parse(new TextDecoder().decode(pt)); })
            .catch(function() { return null; });
    }

    function exportKeyB64(key) { return crypto.subtle.exportKey("raw", key).then(bufToB64); }
    function importKeyB64(b64) {
        return crypto.subtle.importKey("raw", b64ToBuf(b64), "AES-GCM", false, ["decrypt"]);
    }

    // 用口令尝试解锁：成功返回 CryptoKey，失败返回 null
    function unlock(password) {
        return loadMeta().then(function(meta) {
            if (!meta) return null;
            // 明文索引（未跑加密步骤）时给出明确原因，而不是误报"密码错误"
            if (Array.isArray(meta) || !meta.kdf) {
                throw new Error("secret.json 是明文（未加密）。请先运行 node scripts/encrypt-secret.mjs public 再预览/部署");
            }
            if (!meta.items || !meta.items.length) return null;
            return deriveKey(password, meta).then(function(key) {
                return decryptItem(key, meta.items[0]).then(function(first) {
                    if (first === null) return null;
                    return exportKeyB64(key).then(function(b64) {
                        try { sessionStorage.setItem("secretKey", b64); } catch (e) {}
                        return key;
                    });
                });
            });
        });
    }

    // 从本会话已保存的密钥恢复（无则 null）
    function sessionKey() {
        var b64 = null;
        try { b64 = sessionStorage.getItem("secretKey"); } catch (e) {}
        if (!b64) return Promise.resolve(null);
        return importKeyB64(b64).catch(function() { return null; });
    }

    // 解密全部隐藏条目（title/date/tags/categories/contents/html/permalink）
    function items(key) {
        return loadMeta().then(function(meta) {
            if (!meta || !meta.items) return [];
            var jobs = meta.items.map(function(item) {
                return decryptItem(key, item).then(function(j) {
                    if (j !== null) { j.permalink = item.p; }
                    return j;
                });
            });
            return Promise.all(jobs).then(function(list) {
                return list.filter(function(x) { return x !== null; });
            });
        });
    }

    return { unlock: unlock, sessionKey: sessionKey, items: items };
})();
</script>

<!-- ==================== 首页特效：轮播 / 打字机循环 / 音乐 / 隐藏区解锁 ==================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. 背景轮播
    var slides = document.querySelectorAll("#home-slider .slide");
    var currentSlide = 0;
    if (slides.length > 0) {
        slides[0].classList.add("active");
        setInterval(function() {
            slides[currentSlide].classList.remove("active");
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add("active");
        }, 6000);
    }

    // 2. 打字机：打出 → 停顿 → 缓缓退格 → 停顿 → 再打出，无限循环
    var typingEl = document.getElementById("typing-text");
    if (typingEl) {
        var text = typingEl.getAttribute("data-text") || "";
        typingEl.textContent = "";
        var i = 0;
        var deleting = false;
        var TYPE_MS = 140;    // 打字节奏：每字符 140ms
        var BACK_MS = 80;     // 退格节奏：每字符 80ms，同样缓
        var HOLD_FULL = 1800; // 打完停顿
        var HOLD_EMPTY = 600; // 退完停顿
        function tick() {
            if (!deleting) {
                if (i < text.length) {
                    typingEl.textContent += text.charAt(i);
                    i++;
                    setTimeout(tick, TYPE_MS);
                } else {
                    deleting = true;
                    setTimeout(tick, HOLD_FULL);
                }
            } else {
                if (i > 0) {
                    i--;
                    typingEl.textContent = text.slice(0, i);
                    setTimeout(tick, BACK_MS);
                } else {
                    deleting = false;
                    setTimeout(tick, HOLD_EMPTY);
                }
            }
        }
        setTimeout(tick, 600);
    }

    // 3. 背景音乐（跨页记忆播放状态）
    var music = document.getElementById("bg-music"); var btn = document.getElementById("music-btn");
    if (music && btn) {
        music.volume = 0.4;
        var wasPlaying = sessionStorage.getItem("musicPlaying") === "true";
        var savedTime = sessionStorage.getItem("musicTime");
        if (wasPlaying) {
            if (savedTime) music.currentTime = parseFloat(savedTime);
            music.play().then(() => { btn.innerHTML = "And so, we met."; }).catch(e => {});
        }
        music.addEventListener("play", function() { sessionStorage.setItem("musicPlaying", "true"); btn.innerHTML = "And so, we met."; });
        music.addEventListener("pause", function() { sessionStorage.setItem("musicPlaying", "false"); btn.innerHTML = "What if God were a girl？"; });
        setInterval(function() { if (!music.paused) sessionStorage.setItem("musicTime", music.currentTime); }, 1000);
        btn.addEventListener("click", function() { if (music.paused) music.play(); else music.pause(); });
    }

    // 4. 隐藏区登录验证（加密验证：口令对 → 能解开加密索引；解开后显示隐藏文章）
    function revealSecretCards(key) {
        SecretVault.items(key).then(function(items) {
            document.querySelectorAll(".secret-card").forEach(function(card) {
                card.hidden = false;
                var titleSlot = card.querySelector("[data-secret-title]");
                if (titleSlot) {
                    var permalink = titleSlot.getAttribute("data-secret-title");
                    var found = null;
                    items.forEach(function(it) { if (it.permalink === permalink) found = it; });
                    if (found) {
                        titleSlot.innerHTML = "";
                        var a = document.createElement("a");
                        a.href = found.permalink;
                        a.textContent = found.title;
                        titleSlot.appendChild(a);
                    }
                }
            });
        });
    }

    var loginBtn = document.getElementById("login-btn");
    if (loginBtn) {
        var msg = document.getElementById("login-msg");
        SecretVault.sessionKey().then(function(key) {
            if (key) {
                if (msg) { msg.style.color = "#2ed573"; msg.innerText = "已验证，隐藏文章已显示。"; msg.style.display = "block"; }
                revealSecretCards(key);
            }
        });
        loginBtn.addEventListener("click", function() {
            var userVal = document.getElementById("login-user").value;
            var posVal = document.getElementById("login-pos").value;
            var timeVal = document.getElementById("login-time").value;
            var password = [userVal, posVal, timeVal].join(":");
            SecretVault.unlock(password).then(function(key) {
                if (key) {
                    msg.style.color = "#2ed573";
                    msg.innerText = "验证成功，隐藏文章已显示！";
                    msg.style.display = "block";
                    revealSecretCards(key);
                } else {
                    msg.style.color = "#ff4757";
                    msg.innerText = "密码或口令错误";
                    msg.style.display = "block";
                }
            }).catch(function(err) {
                msg.style.color = "#ff4757";
                var reason = (err && err.message) ? err.message : "未知原因";
                if (!window.crypto || !window.crypto.subtle) reason = "当前浏览器不支持网页加密，请换最新版 Chrome / Edge 访问";
                msg.innerText = "验证失败：" + reason;
                msg.style.display = "block";
            });
        });
    }
});
</script>
{{ end }}
