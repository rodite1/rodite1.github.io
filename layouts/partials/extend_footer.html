<!-- 自定义雪花特效 -->
<canvas id="snow-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;"></canvas>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var canvas = document.getElementById("snow-canvas");
    var ctx = canvas.getContext("2d");
    var width = canvas.width = window.innerWidth;
    var height = canvas.height = window.innerHeight;
    var flakes = [];

    window.addEventListener("resize", function() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    // 创建雪花
    for (var i = 0; i < 150; i++) { // 这里的 150 是雪花数量，可以自己调
        flakes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 3 + 1, // 雪花半径
            d: Math.random() + 1, // 下落速度
            color: "rgba(255, 255, 255, " + (Math.random() * 0.5 + 0.3) + ")" // 半透明
        });
    }

    function drawFlakes() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "white";
        ctx.beginPath();
        for (var i = 0; i < flakes.length; i++) {
            var f = flakes[i];
            ctx.fillStyle = f.color;
            ctx.moveTo(f.x, f.y);
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
        }
        ctx.fill();
        moveFlakes();
    }

    var angle = 0;
    function moveFlakes() {
        angle += 0.01;
        for (var i = 0; i < flakes.length; i++) {
            var f = flakes[i];
            f.y += Math.pow(f.d, 2) + 0.5;
            f.x += Math.sin(angle) * 1; // 左右飘动

            // 如果雪花到底部，重新放到顶部
            if (f.y > height) {
                flakes[i] = {
                    x: Math.random() * width,
                    y: 0,
                    r: f.r,
                    d: f.d,
                    color: f.color
                };
            }
        }
    }

    setInterval(drawFlakes, 30);
});
</script>


<!-- 首页专属特效：轮播图与背景音乐 -->
{{ if .IsHome }}
<!-- 轮播图容器 -->
<div id="home-slider">
    <div class="slide" style="background-image: url('/bg1.jpg');"></div>
    <div class="slide" style="background-image: url('/bg2.jpg');"></div>
    <div class="slide" style="background-image: url('/bg3.jpg');"></div>
    <div class="slide" style="background-image: url('/bg4.jpg');"></div>
    <div class="slide" style="background-image: url('/bg5.jpg');"></div>
</div>

<!-- 背景音乐 -->
<audio id="bg-music" src="/music.mp3" loop></audio>

<!-- 悬浮音乐按钮（已移动至左上角，并替换文字） -->
<button id="music-btn" style="position: fixed; top: 80px; left: 20px; z-index: 10000; padding: 10px 15px; border-radius: 20px; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5); cursor: pointer; backdrop-filter: blur(5px); font-size: 14px; transition: all 0.3s ease;">
    What if God were a girl？
</button>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. 轮播图逻辑
    var slides = document.querySelectorAll(".slide");
    var currentSlide = 0;
    if (slides.length > 0) {
        slides[0].classList.add("active");
        setInterval(function() {
            slides[currentSlide].classList.remove("active");
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add("active");
        }, 6000);
    }

    // 2. 音乐记忆与播放逻辑
    var music = document.getElementById("bg-music");
    var btn = document.getElementById("music-btn");
    
    if (music && btn) {
        music.volume = 0.4; // 音量
        
        // 读取上次的播放状态
        var wasPlaying = sessionStorage.getItem("musicPlaying") === "true";
        var savedTime = sessionStorage.getItem("musicTime");

        // 如果上次是在播放状态，则恢复进度并尝试播放
        if (wasPlaying) {
            if (savedTime) {
                music.currentTime = parseFloat(savedTime);
            }
            music.play().then(() => {
                btn.innerHTML = "And so, we met.";
            }).catch(e => {
                // 如果被浏览器拦截，保持初始文字，等用户点击页面
                btn.innerHTML = "What if God were a girl？";
            });
        }

        // 监听播放事件：更新按钮文字，记录状态
        music.addEventListener("play", function() {
            sessionStorage.setItem("musicPlaying", "true");
            btn.innerHTML = "And so, we met.";
        });

        // 监听暂停事件：更新按钮文字，记录状态
        music.addEventListener("pause", function() {
            sessionStorage.setItem("musicPlaying", "false");
            btn.innerHTML = "What if God were a girl？";
        });

        // 定时保存当前播放进度（每秒存一次，保证切页回来能接上）
        setInterval(function() {
            if (!music.paused) {
                sessionStorage.setItem("musicTime", music.currentTime);
            }
        }, 1000);

        // 点击按钮控制播放/暂停
        btn.addEventListener("click", function() {
            if (music.paused) {
                music.play();
            } else {
                music.pause();
            }
        });
        
        // 首次点击页面自动播放（针对浏览器拦截自动播放的妥协方案）
        document.body.addEventListener("click", function() {
            // 只有在没被用户主动暂停过的情况下才自动播放
            if (music.paused && sessionStorage.getItem("musicPlaying") !== "false") {
                music.play().catch(e => console.log("等待用户交互"));
            }
        }, { once: true });
    }
});
</script>
{{ end }}
